<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Credit Karma — Home</title>
<style>
:root{
  --paper:#fff;--ink:#111;--mute:#3a3a3a;--chip:#dcefe0;--link:#1b5c3a;
  --pill:#fff;--line:#e6e6e6;--pulse:#1f8a4d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d0c0b}
body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.phone{width:390px;height:844px;background:var(--paper);border-radius:38px;overflow:hidden;position:relative}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;font-weight:600}
.status .sig{display:flex;gap:5px;align-items:center}
.status .sig i{width:4px;height:8px;background:var(--ink);border-radius:1px}
.status .sig i:nth-child(2){height:11px}
.status .sig i:nth-child(3){height:14px}
.status .batt{width:22px;height:11px;border:1.4px solid var(--ink);border-radius:3px;position:relative}
.status .batt::after{content:"";position:absolute;left:2px;top:2px;bottom:2px;width:12px;background:var(--ink);border-radius:1px}
.pad{padding:4px 20px 0}
.tools{display:flex;justify-content:flex-end;gap:16px;margin-bottom:18px}
.tools svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8}
h1{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin-bottom:18px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.face{width:44px;height:44px;border-radius:50%;background:var(--chip);flex:0 0 auto;display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--link)}
.pill{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--pill);font-size:13px;font-weight:600;white-space:nowrap}
.pill b{width:22px;height:22px;border-radius:50%;background:var(--pulse);display:grid;place-items:center;flex:0 0 auto}
.pill b svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2}
h2{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-bottom:14px}
.goals{display:flex;gap:10px;margin-bottom:16px}
.goal{flex:1;background:var(--chip);border-radius:16px;padding:16px 14px;font-size:15px;font-weight:700;line-height:1.25}
a.upd{color:var(--link);font-size:16px;font-weight:600;text-decoration:none}
html[data-ck-cover],html[data-ck-cover] body{background:var(--paper)!important;margin:0;padding:0;height:100%;overflow:hidden;display:block}
html[data-ck-cover] .phone{border-radius:0}
</style>
<script>if(/[?&]cover=1(?:&|$)/.test(location.search))document.documentElement.setAttribute("data-ck-cover","1")</script>
</head>
<body>
<div class="phone">
  <div class="status"><span>12:22</span><span class="sig"><i></i><i></i><i></i><span class="batt"></span></span></div>
  <div class="pad">
    <div class="tools" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5"/><path d="M10 17a2 2 0 0 0 4 0"/></svg>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </div>
    <h1>Welcome back Miri</h1>
    <div class="row">
      <div class="face" aria-hidden="true">M</div>
      <div class="pill"><b><svg viewBox="0 0 24 24"><path d="M4 12h3l2-5 3 10 2-6h6"/></svg></b>Credit score: 750</div>
      <div class="pill"><b><svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M17 7H9.5a3.5 3.5 0 0 0 0 7H14a3.5 3.5 0 0 1 0 7H6"/></svg></b>Annual income: $65k</div>
    </div>
    <h2>Your goals</h2>
    <div class="goals">
      <div class="goal">Pay off credit card debt</div>
      <div class="goal">Home buying</div>
    </div>
    <a class="upd" href="#">Update goals</a>
  </div>
</div>
</body>
</html>
